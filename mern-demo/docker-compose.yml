version: '3.8'

services:
  # Câu 81: Khai báo Service backend
  mern-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mern-backend
    # Câu 83: Cấu hình Port cho Backend
    ports:
      - "5000:5000"
    # Câu 85: Cấu hình biến môi trường MONGODB_URI
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://hauhuynhh_db_user:BI3WOnqFUwCPU2Vp@cluster0.5e9dadn.mongodb.net/cloud_lab?retryWrites=true&w=majority
    networks:
      - mern-network

  # Câu 82: Khai báo Service frontend
  mern-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mern-frontend
    # Câu 84: Cấu hình Port cho Frontend
    ports:
      - "3000:3000"
    depends_on:
      - mern-backend
    networks:
      - mern-network

# Cấu hình mạng kết nối chung
networks:
  mern-network:
    driver: bridge